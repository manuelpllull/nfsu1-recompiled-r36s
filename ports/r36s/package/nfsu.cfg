# NFSU1 settings, read by NFSU.sh at launch (see the comments in NFSU.sh for every option).
# Graphics: performance | balanced | quality (the game's own Low / Medium / High detail presets)
NFSU_GRAPHICS=performance
# Frame cap: 30, 60, or 0 (uncapped on faster hardware)
NFSU_FPS=30
# Vsync: 1 (default), or 0 to let an uncapped run (NFSU_FPS=0) exceed the panel's refresh rate (may tear)
#NFSU_VSYNC=1
# Language: Spanish | English | French | German | Italian | Dutch | Swedish
NFSU_LANG=Spanish
# Scenery props beyond this many metres that are only a few pixels across are not drawn (0 = off)
NFSU_DRAW_DIST=150
NFSU_CULL_PX=7
# Native matrix paths default to 1; set NFSU_WORLD_MATRIX=0 or NFSU_MATRIX_MULTIPLY=0 for lifted code.
# Diagnostic mode 2 compares each native path against the lifted original.
