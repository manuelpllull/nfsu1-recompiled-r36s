name: Release R36S bundle

# Builds the PortMaster bundle for the R36S (launcher, settings, metadata, docs, and the game binary when the
# guest objects are available) and publishes it as a GitHub release.
#   - Push a tag named r36s-v* (git tag r36s-v1.0.0 && git push origin r36s-v1.0.0): one step. The binary is
#     built when the guest objects can be found, otherwise the bundle is published without it. Published, not draft.
#   - Or run it by hand (Actions > Release R36S bundle > Run workflow), a draft by default.
#
# The game binary (nfsu.aarch64) contains the lifted game code, which is generated from Speed.exe and is
# not in this repository. As in the NFSU2 repository, it is built here from precompiled guest objects
# (the *.o of the lifted code), uploaded once to a release tagged r36s-guest-objs (pre-release) with
#     bash scripts/publish_guest_objs.sh
# (the NFSU1 counterpart of NFSU2's "build.py --export-guest --publish"; run it again whenever the game code is
# rebuilt). Lookup order: 1. the repository secret GUEST_OBJS_URL (a direct link to a tar.gz), if set;
# 2. the .tar.gz asset of the release r36s-guest-objs.
# A release asset of a public repository is public, so that archive (and the binary in the bundle) are
# downloadable by anyone: they are derived from the game's code.

on:
  push:
    tags:
      - 'r36s-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. r36s-v12)'
        required: true
        type: string
      release_title:
        description: 'Release title (empty = "NFSU1 R36S <tag>")'
        required: false
        default: ''
        type: string
      build_id:
        description: 'Build id shown in the game banner (empty = the tag)'
        required: false
        default: ''
        type: string
      include_binary:
        description: 'Build nfsu.aarch64 from the guest objects (release r36s-guest-objs, made by scripts/publish_guest_objs.sh, or the GUEST_OBJS_URL secret) and include it'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create the release as a draft'
        required: false
        default: true
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
      EVENT: ${{ github.event_name }}
      RELEASE_TITLE: ${{ inputs.release_title }}
      BUILD_ID_INPUT: ${{ inputs.build_id }}
      INCLUDE_INPUT: ${{ inputs.include_binary }}
      GUEST_OBJS_URL: ${{ secrets.GUEST_OBJS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked files
        run: bash scripts/check_no_game_files.sh

      - name: Install the ARM64 cross toolchain and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu zip

      - name: Decide whether to build the binary
        run: |
          # tag push: build it when the guest objects are found; manual run: only when include_binary is ticked (then they are required)
          if [ "$EVENT" = "push" ]; then MODE=auto; elif [ "$INCLUDE_INPUT" = "true" ]; then MODE=required; else MODE=off; fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "binary mode: $MODE"

      - name: Build nfsu.aarch64 from the guest objects
        if: ${{ env.MODE != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p build/guest-archives build/guest-objs build/out
          FOUND=false
          if [ -n "$GUEST_OBJS_URL" ]; then
            echo "Downloading the guest objects from the GUEST_OBJS_URL secret..."
            curl -fsSL "$GUEST_OBJS_URL" -o build/guest-archives/guest-objs.tar.gz && FOUND=true
          fi
          if [ "$FOUND" = "false" ]; then
            echo "Looking for the guest objects in the release 'r36s-guest-objs'..."
            gh release download r36s-guest-objs -p '*.tar.gz' -D build/guest-archives --repo "$GITHUB_REPOSITORY" && FOUND=true || true
          fi
          if [ "$FOUND" = "false" ]; then
            if [ "$MODE" = "auto" ]; then
              echo "::warning::Guest objects not found (release r36s-guest-objs or secret GUEST_OBJS_URL): publishing the bundle without the binary."
              exit 0
            fi
            echo "::error::Guest objects not found. Run scripts/publish_guest_objs.sh (release r36s-guest-objs), or set the secret GUEST_OBJS_URL."
            exit 1
          fi
          for archive in build/guest-archives/*.tar.gz; do tar -xzf "$archive" -C build/guest-objs; done
          COUNT="$(find build/guest-objs -name '*.o' | wc -l | tr -d ' ')"
          [ "$COUNT" -gt 0 ] || { echo "::error::no *.o files in the guest objects archive"; exit 1; }
          echo "Found $COUNT guest objects."
          GUEST_DIR="$GITHUB_WORKSPACE/build/guest-objs" \
          OUT="$GITHUB_WORKSPACE/build/out" \
          BUILD_ID="${BUILD_ID_INPUT:-$TAG_NAME}" \
          bash ports/r36s/build_ci.sh

      - name: Package the PortMaster bundle
        run: |
          set -e
          if [ -f build/out/nfsu.aarch64 ]; then export BINARY="$GITHUB_WORKSPACE/build/out/nfsu.aarch64"; fi
          bash ports/r36s/package_release.sh

      - name: Write the release notes
        run: |
          mkdir -p build
          {
            echo "## Need for Speed: Underground, R36S / PortMaster"
            echo
            echo "- Target: Rockchip RK3326 handhelds (R36S, RG351MP, ...) with ArkOS, AmberELEC or ROCKNIX, 640x480, ARM64"
            echo "- Graphics: Direct3D 9 translated to OpenGL ES 2.0 (MojoShader)"
            echo "- Commit: ${GITHUB_SHA}"
            echo
            echo "### Install"
            echo "1. Extract \`NFSU-R36S.zip\` into the \`ports/\` folder of your SD card (you get \`NFSU.sh\` and \`nfsu/\`)."
            echo "2. Copy your own retail PC game files (patch 1.4: \`Speed.exe\`, \`GLOBAL\`, \`CARS\`, \`TRACKS\`, \`SOUND\`, \`MOVIES\`, ...) into \`ports/nfsu/gamedata/\`."
            echo "3. Start it from the Ports menu. Settings are in \`nfsu/nfsu.cfg\`; see \`nfsu/README.md\`."
            echo
            if [ ! -f build/out/nfsu.aarch64 ]; then
              echo "> This bundle does **not** include the game binary \`nfsu.aarch64\`; it has to be built from your own copy of the game (see the README)."
              echo
            fi
            echo "No game files are included. Credits: the [NFSU2 Recompiled](https://github.com/codepdbh/nfsu2-recompiled) project and [pcrecomp](https://github.com/sp00nznet/pcrecomp)."
          } > build/release_notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.release_title != '' && inputs.release_title || format('NFSU1 R36S {0}', inputs.tag_name || github.ref_name) }}
          draft: ${{ inputs.draft || false }}
          prerelease: false
          body_path: build/release_notes.md
          files: |
            dist/NFSU-R36S.zip
            dist/NFSU-R36S.zip.sha256
