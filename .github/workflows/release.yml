name: Release R36S bundle

# Manual only (Actions > Release R36S bundle > Run workflow). Builds the PortMaster bundle for the R36S
# (launcher, settings, metadata, docs) and publishes it as a GitHub release, a draft by default.
#
# The game binary (nfsu.aarch64) contains the lifted game code, which is generated from Speed.exe and is
# not in this repository. As in the NFSU2 repository, it is built here from precompiled guest objects
# (the *.o of the lifted code) when include_binary is ticked. The objects are looked up in this order:
#   1. the repository secret GUEST_OBJS_URL (a direct link to a tar.gz of the *.o files), if set;
#   2. a release of this repository tagged r36s-guest-objs with a .tar.gz asset (mark it as a pre-release).
# Create the archive on the machine where the game was built:
#     tar czf guest-objs.tar.gz -C build/r36s-vm/guest .
#     gh release create r36s-guest-objs guest-objs.tar.gz --prerelease --title "Guest objects (CI input)" --notes "Precompiled guest objects for the CI build"
# A release asset of a public repository is public, so that archive (and the binary in the bundle) are
# downloadable by anyone: they are derived from the game's code. Leave include_binary off to publish the
# launcher-only bundle.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. r36s-v12)'
        required: true
        type: string
      release_title:
        description: 'Release title (empty = "NFSU1 R36S <tag>")'
        required: false
        default: ''
        type: string
      build_id:
        description: 'Build id shown in the game banner (empty = the tag)'
        required: false
        default: ''
        type: string
      include_binary:
        description: 'Build nfsu.aarch64 from the guest objects (release r36s-guest-objs or the GUEST_OBJS_URL secret) and include it'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create the release as a draft'
        required: false
        default: true
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      RELEASE_TITLE: ${{ inputs.release_title }}
      BUILD_ID_INPUT: ${{ inputs.build_id }}
      INCLUDE_BINARY: ${{ inputs.include_binary }}
      GUEST_OBJS_URL: ${{ secrets.GUEST_OBJS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked files
        run: bash scripts/check_no_game_files.sh

      - name: Install the ARM64 cross toolchain and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu zip

      - name: Build nfsu.aarch64 from the guest objects
        if: ${{ inputs.include_binary }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p build/guest-archives build/guest-objs build/out
          FOUND=false
          if [ -n "$GUEST_OBJS_URL" ]; then
            echo "Downloading the guest objects from the GUEST_OBJS_URL secret..."
            curl -fsSL "$GUEST_OBJS_URL" -o build/guest-archives/guest-objs.tar.gz && FOUND=true
          fi
          if [ "$FOUND" = "false" ]; then
            echo "Looking for the guest objects in the release 'r36s-guest-objs'..."
            gh release download r36s-guest-objs -p '*.tar.gz' -D build/guest-archives --repo "$GITHUB_REPOSITORY" && FOUND=true || true
          fi
          if [ "$FOUND" = "false" ]; then
            echo "::error::Guest objects not found. Upload guest-objs.tar.gz to a release tagged r36s-guest-objs (pre-release), or set the secret GUEST_OBJS_URL."
            exit 1
          fi
          for archive in build/guest-archives/*.tar.gz; do tar -xzf "$archive" -C build/guest-objs; done
          COUNT="$(find build/guest-objs -name '*.o' | wc -l | tr -d ' ')"
          [ "$COUNT" -gt 0 ] || { echo "::error::no *.o files in the guest objects archive"; exit 1; }
          echo "Found $COUNT guest objects."
          GUEST_DIR="$GITHUB_WORKSPACE/build/guest-objs" \
          OUT="$GITHUB_WORKSPACE/build/out" \
          BUILD_ID="${BUILD_ID_INPUT:-$TAG_NAME}" \
          bash ports/r36s/build_ci.sh

      - name: Package the PortMaster bundle
        run: |
          set -e
          if [ "$INCLUDE_BINARY" = "true" ]; then export BINARY="$GITHUB_WORKSPACE/build/out/nfsu.aarch64"; fi
          bash ports/r36s/package_release.sh

      - name: Write the release notes
        run: |
          mkdir -p build
          {
            echo "## Need for Speed: Underground, R36S / PortMaster"
            echo
            echo "- Target: Rockchip RK3326 handhelds (R36S, RG351MP, ...) with ArkOS, AmberELEC or ROCKNIX, 640x480, ARM64"
            echo "- Graphics: Direct3D 9 translated to OpenGL ES 2.0 (MojoShader)"
            echo "- Commit: ${GITHUB_SHA}"
            echo
            echo "### Install"
            echo "1. Extract \`NFSU-R36S.zip\` into the \`ports/\` folder of your SD card (you get \`NFSU.sh\` and \`nfsu/\`)."
            echo "2. Copy your own retail PC game files (patch 1.4: \`Speed.exe\`, \`GLOBAL\`, \`CARS\`, \`TRACKS\`, \`SOUND\`, \`MOVIES\`, ...) into \`ports/nfsu/gamedata/\`."
            echo "3. Start it from the Ports menu. Settings are in \`nfsu/nfsu.cfg\`; see \`nfsu/README.md\`."
            echo
            if [ "$INCLUDE_BINARY" != "true" ]; then
              echo "> This bundle does **not** include the game binary \`nfsu.aarch64\`; it has to be built from your own copy of the game (see the README)."
              echo
            fi
            echo "No game files are included. Credits: the [NFSU2 Recompiled](https://github.com/codepdbh/nfsu2-recompiled) project and [pcrecomp](https://github.com/sp00nznet/pcrecomp)."
          } > build/release_notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_title != '' && inputs.release_title || format('NFSU1 R36S {0}', inputs.tag_name) }}
          draft: ${{ inputs.draft }}
          prerelease: false
          body_path: build/release_notes.md
          files: |
            dist/NFSU-R36S.zip
            dist/NFSU-R36S.zip.sha256
